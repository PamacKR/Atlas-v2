<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Atlas</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>Atlas</h1>
      <p id="data-dir" class="muted"></p>
    </header>

    <section>
      <h2>Courses</h2>
      <ul id="course-list"></ul>

      <form id="course-form">
        <input id="course-name" type="text" placeholder="Course name" required />
        <input id="course-code" type="text" placeholder="Code (optional)" />
        <select id="course-term">
          <option value="">Term (optional)</option>
          <option value="Monsoon 26">Monsoon 26</option>
          <option value="Spring 27">Spring 27</option>
          <option value="Monsoon 27">Monsoon 27</option>
          <option value="Spring 28">Spring 28</option>
        </select>
        <button type="submit">Add course</button>
      </form>
    </section>

    <section id="resources-section" hidden>
      <div class="resources-header">
        <h2 id="resources-heading">Resources</h2>
        <div class="view-toggle">
          <button id="view-list" type="button" class="active">List</button>
          <button id="view-icons" type="button">Icons</button>
        </div>
      </div>
      <ul id="resource-list" class="view-list"></ul>
      <button id="upload-button" type="button">Upload file</button>
    </section>
  </div>

  <div id="preview-overlay" hidden>
    <div id="preview-panel">
      <div id="preview-panel-header">
        <span id="preview-title"></span>
        <button id="preview-close" type="button">Close</button>
      </div>
      <p id="preview-note" class="muted" hidden></p>
      <div id="preview-body"></div>
    </div>
  </div>

  <div id="confirm-overlay" hidden>
    <div id="confirm-panel">
      <p id="confirm-message"></p>
      <div id="confirm-actions">
        <button id="confirm-cancel" type="button">Cancel</button>
        <button id="confirm-yes" type="button">Delete</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
