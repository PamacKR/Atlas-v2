<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Atlas</title>
  <link rel="stylesheet" href="renderer.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>Atlas</h1>
      <div id="search-box">
        <input id="search-input" type="text" placeholder="Search notes, resources…" autocomplete="off" />
        <ul id="search-results" hidden></ul>
      </div>
      <p id="data-dir" class="muted"></p>
    </header>

    <section>
      <div class="courses-header">
        <h2>Courses</h2>
        <select id="semester-filter">
          <option value="">All semesters</option>
          <option value="Monsoon 26">Monsoon 26</option>
          <option value="Spring 27">Spring 27</option>
          <option value="Monsoon 27">Monsoon 27</option>
          <option value="Spring 28">Spring 28</option>
        </select>
      </div>
      <form id="course-form">
        <input id="course-name" type="text" placeholder="Course name" required />
        <input id="course-code" type="text" placeholder="Code (optional)" />
        <select id="course-term">
          <option value="">Semester</option>
          <option value="Monsoon 26">Monsoon 26</option>
          <option value="Spring 27">Spring 27</option>
          <option value="Monsoon 27">Monsoon 27</option>
          <option value="Spring 28">Spring 28</option>
        </select>
        <button type="submit">Add course</button>
      </form>

      <ul id="course-list"></ul>
    </section>

    <section id="resources-section" hidden>
      <div class="resources-header">
        <h2 id="resources-heading">Resources</h2>
        <div class="view-toggle">
          <button id="view-list" type="button" class="active">List</button>
          <button id="view-icons" type="button">Icons</button>
        </div>
      </div>
      <ul id="resource-list" class="view-list"></ul>
      <button id="upload-button" type="button">Upload file</button>
    </section>

    <section id="notes-section" hidden>
      <div class="resources-header">
        <h2 id="notes-heading">Notes</h2>
      </div>
      <ul id="note-list"></ul>
      <button id="new-note-button" type="button">New note</button>
    </section>

    <section id="deadlines-section" hidden>
      <div class="resources-header">
        <h2 id="deadlines-heading">Deadlines</h2>
      </div>
      <ul id="deadline-list"></ul>
      <form id="deadline-form">
        <input id="deadline-title" type="text" placeholder="Title" required />
        <select id="deadline-kind">
          <option value="assignment">Assignment</option>
          <option value="reading">Reading</option>
          <option value="quiz">Quiz</option>
          <option value="lab">Lab</option>
          <option value="project">Project</option>
          <option value="exam">Exam</option>
          <option value="manual">Other</option>
        </select>
        <input id="deadline-due" type="date" />
        <button type="submit">Add deadline</button>
      </form>
    </section>

    <section id="watched-folders-section" hidden>
      <h3>Watched folders</h3>
      <p class="muted">Files added to a watched folder are copied in automatically.</p>
      <ul id="watched-folder-list"></ul>
      <button id="add-watch-folder" type="button">Watch a folder…</button>
    </section>
  </div>

  <div id="note-editor-overlay" hidden>
    <div id="note-editor-panel">
      <div id="note-editor-header">
        <input id="note-title-input" type="text" placeholder="Untitled" />
        <div id="note-editor-actions">
          <span id="note-save-status" class="muted"></span>
          <button id="note-fullscreen" type="button" title="Fullscreen" aria-label="Fullscreen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
          </button>
          <button id="note-close" type="button" title="Close" aria-label="Close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </div>
      <div id="note-editor-root"></div>
    </div>
  </div>

  <div id="preview-overlay" hidden>
    <div id="preview-panel">
      <div id="preview-panel-header">
        <span id="preview-title"></span>
        <div id="preview-panel-actions">
          <button id="preview-fullscreen" type="button" title="Fullscreen" aria-label="Fullscreen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
          </button>
          <button id="preview-close" type="button" title="Close" aria-label="Close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </div>
      <p id="preview-note" class="muted" hidden></p>
      <div id="zoom-controls" hidden>
        <button id="zoom-out" type="button" title="Zoom out" aria-label="Zoom out">−</button>
        <span id="zoom-level">100%</span>
        <button id="zoom-in" type="button" title="Zoom in" aria-label="Zoom in">+</button>
        <button id="zoom-reset" type="button" title="Reset zoom">Reset</button>
      </div>
      <div id="preview-body"></div>
    </div>
  </div>

  <div id="confirm-overlay" hidden>
    <div id="confirm-panel">
      <p id="confirm-message"></p>
      <div id="confirm-actions">
        <button id="confirm-cancel" type="button">Cancel</button>
        <button id="confirm-yes" type="button">Delete</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
